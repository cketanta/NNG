<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 法杖：杖身渐变 + 能量法球 + 宝石发光 -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a4a"/>
      <stop offset="1" stop-color="#4a3520"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0f0ff"/>
      <stop offset="0.4" stop-color="#7ab8ff"/>
      <stop offset="1" stop-color="#2a6ac0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
