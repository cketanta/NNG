  <ellipse cx="72" cy="30" rx="26" ry="26" fill="url(#glow)"/>
  <rect x="20" y="48" width="56" height="10" rx="5" fill="url(#wood)" stroke="#2a1a08" stroke-width="2"/>
  <circle cx="20" cy="53" r="12" fill="#5a3a20" stroke="#2a1a08" stroke-width="2"/>
  <polygon points="72,30 84,14 88,30 84,46" fill="url(#orb)" stroke="#1a4a90" stroke-width="2"/>
  <polygon points="76,30 82,22 83.5,30 82,38" fill="#e0f0ff" opacity="0.9"/>
  <circle cx="72" cy="53" r="6" fill="#7ab8ff" opacity="0.5"/>
